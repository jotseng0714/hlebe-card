<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLEBÉ 曾詩喬 | 數位名片</title>
    <!-- 核心庫載入 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .triangle-tr { clip-path: polygon(0 0, 100% 0, 100% 100%); }
        .triangle-bl { clip-path: polygon(0 0, 0 100%, 100% 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 使用內嵌 SVG 圖標以解決外部庫未定義 (ReferenceError) 的問題
        const Icons = {
            Phone: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            ),
            Mail: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            ),
            MapPin: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            ),
            Download: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            ),
            Building: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>
            )
        };

        const App = () => {
            const [qrCodeUrl, setQrCodeUrl] = React.useState('');
            
            const userData = {
                name: "曾詩喬",
                englishName: "Jo Tseng",
                title: "總經理",
                company: "弘林環境生技",
                phone: "0921731527",
                email: "jotseng@gmail.com",
                address: "苗栗縣苗栗市新川里 003 鄰龍岡 8-1 號",
                taxId: "62198034",
                colors: {
                    primary: "#C2CCB2",   // 輕盈苔綠
                    accent: "#DCE6C2",    // 淺米綠三角形
                    text: "#2F3E1B",       // 深橄欖綠
                    info: "#4A5638"        // 中性綠
                }
            };

            const handleSaveContact = () => {
                const vCardData = [
                    "BEGIN:VCARD",
                    "VERSION:3.0",
                    `FN:${userData.name}`,
                    `ORG:${userData.company}`,
                    `TITLE:${userData.title}`,
                    `TEL;TYPE=CELL:${userData.phone}`,
                    `EMAIL:${userData.email}`,
                    `ADR;TYPE=WORK:;;${userData.address}`,
                    `NOTE:統一編號: ${userData.taxId}`,
                    "END:VCARD"
                ].join("\n");

                const blob = new Blob([vCardData], { type: "text/vcard" });
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.setAttribute("download", `${userData.name}_Contact.vcf`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            React.useEffect(() => {
                // 自動抓取當前網址生成 QR Code
                const currentUrl = window.location.href;
                setQrCodeUrl(`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(currentUrl)}&color=2F3E1B&bgcolor=C2CCB2`);
            }, []);

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4">
                    {/* 手機殼效果容器 */}
                    <div className="w-full max-w-[375px] bg-[#FAF9F6] rounded-[40px] shadow-2xl overflow-hidden relative border-[6px] border-white">
                        
                        {/* 上方視覺區 */}
                        <div className="h-52 relative flex flex-col items-center justify-center overflow-hidden" style={{ backgroundColor: userData.colors.primary }}>
                            {/* 右上角斜長三角形 */}
                            <div className="absolute top-0 right-0 w-32 h-16 opacity-100 triangle-tr" style={{ backgroundColor: userData.colors.accent }}></div>
                            {/* 左下角斜長三角形 */}
                            <div className="absolute bottom-0 left-0 w-32 h-16 opacity-100 triangle-bl" style={{ backgroundColor: userData.colors.accent }}></div>
                            
                            <div className="z-10 flex flex-col items-center">
                                <div className="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-full border border-white/30 flex items-center justify-center mb-3">
                                    <svg width="36" height="36" viewBox="0 0 100 100" fill="none">
                                        <path d="M50 15C50 15 25 40 25 65C25 78.8071 36.1929 90 50 90C63.8071 90 75 78.8071 75 65C75 40 50 15 50 15Z" stroke={userData.colors.text} strokeWidth="4"/>
                                        <circle cx="50" cy="62" r="8" fill={userData.colors.text} fillOpacity="0.2" />
                                    </svg>
                                </div>
                                <h1 className="text-lg tracking-[0.4em] font-light" style={{ color: userData.colors.text }}>HLEBÉ</h1>
                            </div>
                        </div>

                        {/* 資訊卡片區 */}
                        <div className="px-6 -mt-10 pb-10 relative z-20">
                            <div className="bg-white rounded-[32px] p-8 shadow-lg border border-gray-50 text-center">
                                <h2 className="text-2xl font-bold tracking-tight" style={{ color: userData.colors.text }}>{userData.name}</h2>
                                <p className="text-sm mt-1 tracking-widest font-medium" style={{ color: userData.colors.info }}>{userData.englishName} | {userData.title}</p>
                                
                                <div className="mt-8 space-y-4 text-left">
                                    {/* 聯絡清單 */}
                                    <a href={`tel:${userData.phone}`} className="flex items-center p-3 hover:bg-slate-50 rounded-2xl transition-colors group">
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center mr-4 bg-[#C2CCB2]/20 text-[#2F3E1B] group-hover:bg-[#2F3E1B] group-hover:text-white transition-all">
                                            <Icons.Phone />
                                        </div>
                                        <div>
                                            <p className="text-[9px] text-gray-400 uppercase tracking-tighter">Mobile</p>
                                            <p className="text-sm font-medium text-gray-700">{userData.phone}</p>
                                        </div>
                                    </a>

                                    <a href={`mailto:${userData.email}`} className="flex items-center p-3 hover:bg-slate-50 rounded-2xl transition-colors group">
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center mr-4 bg-[#C2CCB2]/20 text-[#2F3E1B] group-hover:bg-[#2F3E1B] group-hover:text-white transition-all">
                                            <Icons.Mail />
                                        </div>
                                        <div>
                                            <p className="text-[9px] text-gray-400 uppercase tracking-tighter">Email</p>
                                            <p className="text-sm font-medium text-gray-700">{userData.email}</p>
                                        </div>
                                    </a>

                                    <div className="flex items-center p-3 rounded-2xl">
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center mr-4 bg-[#C2CCB2]/20 text-[#2F3E1B]">
                                            <Icons.Building />
                                        </div>
                                        <div>
                                            <p className="text-[9px] text-gray-400 uppercase tracking-tighter">Company</p>
                                            <p className="text-sm font-medium text-gray-700">{userData.company}</p>
                                            <p className="text-[9px] text-gray-400">統編: {userData.taxId}</p>
                                        </div>
                                    </div>

                                    <div className="flex items-center p-3 rounded-2xl">
                                        <div className="w-10 h-10 rounded-full flex items-center justify-center mr-4 bg-[#C2CCB2]/20 text-[#2F3E1B]">
                                            <Icons.MapPin />
                                        </div>
                                        <div>
                                            <p className="text-[9px] text-gray-400 uppercase tracking-tighter">Address</p>
                                            <p className="text-sm font-medium text-gray-700 leading-tight">{userData.address}</p>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={handleSaveContact} 
                                    className="w-full mt-8 py-4 rounded-2xl font-bold shadow-xl flex items-center justify-center gap-2 transition-all active:scale-95 text-white" 
                                    style={{ backgroundColor: userData.colors.text }}
                                >
                                    <Icons.Download />
                                    儲存聯絡資訊
                                </button>
                            </div>

                            {/* 下方分享區 */}
                            <div className="mt-10 text-center flex flex-col items-center">
                                <div className="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-center">
                                    {qrCodeUrl ? (
                                        <img src={qrCodeUrl} alt="QR Code" className="w-36 h-36" />
                                    ) : (
                                        <div className="w-36 h-36 bg-gray-50 animate-pulse rounded-xl"></div>
                                    )}
                                </div>
                                <p className="mt-4 text-[10px] text-gray-300 italic tracking-widest uppercase">Scan to share digital card</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 確保 DOM 載入後才執行渲染，避免某些環境下的重複宣告錯誤
        const renderApp = () => {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
            }
        };

        if (document.readyState === 'complete') {
            renderApp();
        } else {
            window.addEventListener('load', renderApp);
        }
    </script>
</body>
</html>
