<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLEBÉ 曾詩喬 | 數位名片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* 手機殼容器 */
        .card-shell {
            width: 100%;
            max-width: 375px;
            background: #FAF9F6;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,.25);
            overflow: hidden;
            border: 6px solid white;
        }

        /* 上方視覺區 */
        .card-hero {
            height: 208px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #C2CCB2;
        }
        .triangle-tr {
            position: absolute;
            top: 0; right: 0;
            width: 128px; height: 64px;
            background: #DCE6C2;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }
        .triangle-bl {
            position: absolute;
            bottom: 0; left: 0;
            width: 128px; height: 64px;
            background: #DCE6C2;
            clip-path: polygon(0 0, 0 100%, 100% 100%);
        }
        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-circle {
            width: 64px; height: 64px;
            background: rgba(255,255,255,.2);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .brand-name {
            font-size: 1.125rem;
            letter-spacing: 0.4em;
            font-weight: 300;
            color: #2F3E1B;
        }

        /* 資訊卡片 */
        .info-wrapper {
            padding: 0 24px 40px;
            position: relative;
            z-index: 20;
            margin-top: -40px;
        }
        .info-card {
            background: white;
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            border: 1px solid #f9fafb;
            text-align: center;
        }
        .person-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -.025em;
            color: #2F3E1B;
        }
        .person-sub {
            font-size: .875rem;
            margin-top: 4px;
            letter-spacing: .1em;
            font-weight: 500;
            color: #4A5638;
        }

        /* 聯絡列表 */
        .contact-list {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        .contact-row {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: background .15s;
        }
        a.contact-row:hover { background: #f8fafc; }
        a.contact-row:hover .icon-wrap {
            background: #2F3E1B;
            color: white;
        }
        .icon-wrap {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(194,204,178,.2);
            color: #2F3E1B;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
            transition: background .15s, color .15s;
        }
        .contact-label {
            font-size: 9px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: -.025em;
        }
        .contact-value {
            font-size: .875rem;
            font-weight: 500;
            color: #374151;
            line-height: 1.3;
        }
        .contact-note {
            font-size: 9px;
            color: #9ca3af;
        }

        /* 儲存按鈕 */
        .save-btn {
            width: 100%;
            margin-top: 32px;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            background: #2F3E1B;
            color: white;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,.2);
            transition: transform .1s;
        }
        .save-btn:active { transform: scale(.95); }

        /* QR Code 區 */
        .qr-section {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-box {
            background: white;
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            border: 1px solid #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-box img { width: 144px; height: 144px; display: block; border-radius: 8px; }
        .qr-placeholder {
            width: 144px; height: 144px;
            background: #f9fafb;
            border-radius: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .qr-caption {
            margin-top: 16px;
            font-size: 10px;
            color: #d1d5db;
            font-style: italic;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        /* SVG icon helper */
        svg { display: block; }
    </style>
</head>
<body>

<div class="card-shell">
    <!-- Hero -->
    <div class="card-hero">
        <div class="triangle-tr"></div>
        <div class="triangle-bl"></div>
        <div class="hero-content">
            <div class="logo-circle">
                <svg width="36" height="36" viewBox="0 0 100 100" fill="none">
                    <path d="M50 15C50 15 25 40 25 65C25 78.8071 36.1929 90 50 90C63.8071 90 75 78.8071 75 65C75 40 50 15 50 15Z" stroke="#2F3E1B" stroke-width="4"/>
                    <circle cx="50" cy="62" r="8" fill="#2F3E1B" fill-opacity="0.2"/>
                </svg>
            </div>
            <p class="brand-name">HLEBÉ</p>
        </div>
    </div>

    <!-- Info Card -->
    <div class="info-wrapper">
        <div class="info-card">
            <h1 class="person-name">曾詩喬</h1>
            <p class="person-sub">Jo Tseng | 總經理</p>

            <div class="contact-list">
                <!-- Phone -->
                <a href="tel:0921731527" class="contact-row">
                    <div class="icon-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </div>
                    <div>
                        <p class="contact-label">Mobile</p>
                        <p class="contact-value">0921-731-527</p>
                    </div>
                </a>

                <!-- Email -->
                <a href="mailto:jotseng@gmail.com" class="contact-row">
                    <div class="icon-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                    <div>
                        <p class="contact-label">Email</p>
                        <p class="contact-value">jotseng@gmail.com</p>
                    </div>
                </a>

                <!-- Company -->
                <div class="contact-row">
                    <div class="icon-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>
                    </div>
                    <div>
                        <p class="contact-label">Company</p>
                        <p class="contact-value">弘林環境生技</p>
                        <p class="contact-note">統編: 62198034</p>
                    </div>
                </div>

                <!-- Address -->
                <div class="contact-row">
                    <div class="icon-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <div>
                        <p class="contact-label">Address</p>
                        <p class="contact-value">苗栗縣苗栗市新川里 003 鄰龍岡 8-1 號</p>
                    </div>
                </div>
            </div>

            <button class="save-btn" onclick="saveContact()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                儲存聯絡資訊
            </button>
        </div>

        <!-- QR Code -->
        <div class="qr-section">
            <div class="qr-box">
                <div class="qr-placeholder" id="qr-placeholder"></div>
                <img id="qr-img" src="" alt="QR Code" style="display:none">
            </div>
            <p class="qr-caption">Scan to share digital card</p>
        </div>
    </div>
</div>

<script>
    // QR Code
    (function() {
        var url = encodeURIComponent(window.location.href);
        var src = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + url + '&color=2F3E1B&bgcolor=C2CCB2';
        var img = document.getElementById('qr-img');
        var placeholder = document.getElementById('qr-placeholder');
        img.onload = function() {
            placeholder.style.display = 'none';
            img.style.display = 'block';
        };
        img.src = src;
    })();

    // Save vCard
    function saveContact() {
        var vCard = [
            "BEGIN:VCARD",
            "VERSION:3.0",
            "FN:曾詩喬",
            "ORG:弘林環境生技",
            "TITLE:總經理",
            "TEL;TYPE=CELL:0921731527",
            "EMAIL:jotseng@gmail.com",
            "ADR;TYPE=WORK:;;苗栗縣苗栗市新川里 003 鄰龍岡 8-1 號",
            "NOTE:統一編號: 62198034",
            "END:VCARD"
        ].join("\n");

        var blob = new Blob([vCard], { type: "text/vcard" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "曾詩喬_Contact.vcf";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
